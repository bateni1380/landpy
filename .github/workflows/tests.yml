name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not integration'
      - run: python -m ruff check landpy tests scripts
      - run: python -m ruff format --check landpy tests scripts
      - run: python -m build
      - run: python -m twine check dist/*
  models-and-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,tensorflow]'
      - run: python -m pytest -m integration
        env:
          LANDPY_RUN_MODELS: '1'
      - run: python scripts/execute_notebooks.py
        env:
          MPLBACKEND: Agg
          TF_CPP_MIN_LOG_LEVEL: '3'
      - uses: actions/upload-artifact@v4
        with:
          name: executed-tutorials
          path: tutorials/*.ipynb
