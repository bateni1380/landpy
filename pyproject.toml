[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "landpy"
version = "0.1.1"
description = "Reversible image, landmark and heat-map flows for augmented-reality experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mohammad Reza Bateni"}]
dependencies = ["numpy>=1.24,<3", "Pillow>=10", "opencv-python-headless>=4.8,<6", "matplotlib>=3.7", "requests>=2.31"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics", "Topic :: Scientific/Engineering :: Image Processing"]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.16,<2.22; python_version < '3.14'", "tf-keras>=2.16,<2.22; python_version < '3.14'"]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1", "twine>=5", "ruff>=0.11", "nbformat>=5", "nbclient>=0.10", "nbconvert>=7", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/bateni1380/landpy"
Documentation = "https://github.com/bateni1380/landpy/tree/master/tutorials"
Issues = "https://github.com/bateni1380/landpy/issues"

[tool.setuptools.packages.find]
include = ["landpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real pretrained model inference (explicit opt-in)"]

[tool.ruff]
line-length = 100
exclude = ["docs/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
